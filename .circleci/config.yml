version: 2.1

jobs:
  maroon:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load palette
          command: |
            printf 'shade = 128,0,0\n' > maroon.cfg
      - run:
          name: Build render core
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target maroon -j2
      - run:
          name: Composite maroon layer
          command: LIONSS_LP=1 ./build/maroon --config maroon.cfg --passes 3
  fft_bluestein:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make sequence
          command: |
            printf 'n 1021\n' > seq.txt
      - run:
          name: Build transform
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target fft_bluestein -j2
      - run:
          name: FFT via Bluestein
          command: LIONSS_LP=1 ./build/fft_bluestein --in seq.txt --prime
  Riverstone:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load terrain
          command: |
            printf 'tiles = 64\n' > river.cfg
      - run:
          name: Build erosion sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Riverstone -j2
      - run:
          name: Smooth riverstone bed
          command: LIONSS_LP=1 ./build/Riverstone --config river.cfg --iters 50
  Fenwick:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed array
          command: |
            printf 'n 1024\n' > bit.cfg
      - run:
          name: Build index tree
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Fenwick -j2
      - run:
          name: Query fenwick sums
          command: LIONSS_LP=1 ./build/Fenwick --config bit.cfg --ops 100000
  hashbrown-lite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Vendor crate
          command: |
            printf 'name = hashbrown-lite\n' > Cargo.toml
      - run:
          name: Compile hash table
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hashbrown-lite -j2
      - run:
          name: Benchmark probe sequence
          command: LIONSS_LP=1 ./build/hashbrown-lite --load 0.87 --keys 100000
